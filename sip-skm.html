<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIP SKM – ekran boczny</title>
<style>
:root{--bg:#eceef2;--panel:#fff;--fg:#1d2430;--muted:#5d6878;--line:#d5d9e0;--field:#f4f5f7;
  --ui:"Frutiger","Open Sans","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#1b2029;--fg:#e6e9ee;--muted:#9aa5b4;--line:#2d3644;--field:#12151b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 var(--ui)}
.page{max-width:1100px;margin:0 auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
h1{margin:0;font-size:16px}
.sub{color:var(--muted);font-size:12px}
#controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
#controls label{display:flex;align-items:center;gap:6px}
input[type=text],select,button{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--field)}
#line{width:70px}#dest{width:190px}#route{width:min(100%,420px)}
button{background:transparent;cursor:pointer}

/* ---- ekran LCD (proporcje 8:1) ---- */
#wrap{container-type:inline-size;width:100%}
#board{position:relative;width:100%;aspect-ratio:8/1;background:#05080d;border-radius:1.2cqw;overflow:hidden;
  display:flex;align-items:center;gap:2.2cqw;padding:0 2.4cqw 0 1.6cqw;color:#fff;font-weight:700}
#board::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
#badge{flex:none;height:80%;aspect-ratio:1.15/1;border-radius:1.4cqw;display:flex;align-items:center;justify-content:center;
  background:var(--lc,#1565c0);font-size:7.6cqw;letter-spacing:-.04em;line-height:1;box-shadow:inset 0 0 0 .35cqw rgba(255,255,255,.25)}
#info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.9cqw}
#destRow{display:flex;align-items:baseline;gap:1.6cqw;white-space:nowrap;overflow:hidden}
#dest2{font-size:5.4cqw;line-height:1.05;text-overflow:ellipsis;overflow:hidden}
#tag{font-size:1.9cqw;font-weight:600;color:#ffcc33;letter-spacing:.04em;text-transform:uppercase}
#viaBox{overflow:hidden;white-space:nowrap;position:relative;height:3.3cqw;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 2%,#000 98%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 2%,#000 98%,transparent 100%)}
#via{display:inline-flex;font-size:2.7cqw;font-weight:600;color:#ffcc33;line-height:3.3cqw;will-change:transform}
#via span{padding-right:5cqw;flex:none}
#via.run{animation:scroll var(--dur,20s) linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){#via.run{animation:none}}
body.kiosk{background:#000;cursor:none}
body.kiosk #controls,body.kiosk header{display:none!important}
body.kiosk .page{max-width:none;padding:0;min-height:100vh;justify-content:center}
body.kiosk #board{border-radius:0}
</style>
</head>
<body>
<div class="page">
  <header><h1>SIP SKM – ekran boczny</h1> <span class="sub">Ekran LCD z boku pociągu: linia, cel i przewijana trasa. Dane poniżej możesz zmienić.</span></header>
  <div id="controls">
    <label>Linia <input type="text" id="line" autocomplete="off" maxlength="4"></label>
    <label>Kolor <input type="color" id="color"></label>
    <label>Cel <input type="text" id="dest" autocomplete="off"></label>
    <label>Trasa (stacje, po przecinku) <input type="text" id="route" autocomplete="off"></label>
    <label>Przewijanie <select id="spd"><option value="40">wolno</option><option value="60" selected>normalnie</option><option value="90">szybko</option></select></label>
    <button id="full">Pełny ekran</button>
  </div>
  <div id="wrap">
    <div id="board" role="img" aria-label="Ekran boczny SKM">
      <div id="badge"></div>
      <div id="info">
        <div id="destRow"><span id="dest2"></span></div>
        <div id="viaBox"><div id="via"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var P = new URLSearchParams(location.search);

// Przykładowe dane (S1 Pruszków – Otwock); wpisz własne w polach lub w adresie.
var DEF = { line:"S1", color:"#1565c0", dest:"Otwock",
  route:"Warszawa Zachodnia, Warszawa Centralna, Warszawa Śródmieście, Warszawa Powiśle, Warszawa Stadion, Warszawa Wschodnia, Falenica, Otwock" };

function get(k, d){ var v = P.get(k); return v === null || v === "" ? d : v; }
var st = {
  line:  get("line", DEF.line),
  color: get("color", DEF.color),
  dest:  get("dest", DEF.dest),
  route: get("route", DEF.route),
  spd:   +get("speed", 60)
};
if (!/^#[0-9a-f]{6}$/i.test(st.color)) st.color = /^[0-9a-f]{6}$/i.test(st.color) ? "#" + st.color : DEF.color;

function render(){
  $("badge").textContent = st.line;
  $("badge").style.setProperty("--lc", st.color);
  $("dest2").textContent = st.dest;
  var stops = st.route.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  var txt = stops.length ? "przez: " + stops.join(" • ") : "";
  var via = $("via");
  via.className = ""; via.innerHTML = "";
  if (!txt) return;
  var a = document.createElement("span"); a.textContent = txt; via.appendChild(a);
  var box = $("viaBox");
  if (a.scrollWidth + 8 <= box.clientWidth) return;           // mieści się: bez przewijania
  var b = a.cloneNode(true); via.appendChild(b);               // dwie kopie => płynna pętla
  var px = a.offsetWidth;
  via.style.setProperty("--dur", Math.max(6, px / st.spd * (box.clientWidth / 900 + 1)) + "s");
  via.className = "run";
}

function bind(id, key){
  var el = $(id); el.value = st[key];
  el.addEventListener("input", function(){ st[key] = el.value; render(); });
}
bind("line","line"); bind("color","color"); bind("dest","dest"); bind("route","route");
$("spd").value = String(st.spd); if ($("spd").value !== String(st.spd)) $("spd").value = "60";
$("spd").addEventListener("change", function(){ st.spd = +$("spd").value; render(); });

$("full").addEventListener("click", function(){
  var d = document.documentElement;
  (d.requestFullscreen || d.webkitRequestFullscreen || function(){}).call(d);
  document.body.classList.add("kiosk");
});
document.addEventListener("fullscreenchange", function(){
  if (!document.fullscreenElement) document.body.classList.remove("kiosk");
});
if (P.get("kiosk") === "1") document.body.classList.add("kiosk");

var t; window.addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(render, 150); });
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
